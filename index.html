<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pokédex - Bootcamp II</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <header>
    <h1>Pokédex</h1>
    <p>Consultor de informações da PokeAPI</p>
  </header>

  <main class="container">
    <section class="search-box">
      <input type="text" id="campo-busca" placeholder="Digite o nome ou ID do Pokémon...">
      <button id="botao-buscar">Buscar</button>
    </section>

    <section id="resultado" class="result-box">
      <p class="initial-msg">Digite o nome ou ID de um Pokémon para realizar a busca.</p>
    </section>
  </main>

  <script src="script.js"></script>
</body>
</html>
